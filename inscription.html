<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription — RARE Club Bordeaux</title>
<meta name="description" content="Inscris-toi pour être prévenu·e dès que la première soirée RARE Club est confirmée à Bordeaux : lieu, date et premier invité.">
<link rel="canonical" href="https://rareclub.fr/inscription.html">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RARE Club">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://rareclub.fr/inscription.html">
<meta property="og:title" content="Inscription — RARE Club Bordeaux">
<meta property="og:description" content="Inscris-toi pour être prévenu·e dès que la première soirée RARE Club est confirmée à Bordeaux.">
<meta property="og:image" content="https://rareclub.fr/favicon.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --wine:#1a020b;
    --wine-soft:#260c17;
    --cream:#faf8f2;
    --cream-dim:#e4ddcf;
    --rose-dim: rgba(250,248,242,0.64);
    --line: rgba(250,248,242,0.16);
    --line-strong: rgba(250,248,242,0.3);
    --font-display:'Playfair Display', Georgia, serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{background:var(--wine); color:var(--cream); font-family:var(--font-body); margin:0; line-height:1.55;}
  a{color:inherit;}

  nav{display:flex; align-items:center; justify-content:space-between; padding:22px 28px; max-width:560px; margin:0 auto;}
  nav .word{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:20px;}
  nav .city{font-family:var(--font-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--rose-dim); border:1px solid var(--line); border-radius:999px; padding:5px 12px;}
  nav .back{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--rose-dim); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:6px 13px;
  }
  nav .back:hover{background:var(--cream); border-color:var(--cream); color:var(--wine);}

  main{max-width:560px; margin:0 auto; padding:10px 28px 100px; text-align:center;}

  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--rose-dim); margin:0 0 14px;}
  h1{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:clamp(28px,5.5vw,38px); margin:0 0 14px; text-wrap:balance;}
  .lead{font-size:14px; color:var(--rose-dim); max-width:42ch; margin:0 auto 40px;}

  .card{background:var(--wine-soft); border:1px solid var(--line); padding:36px 30px; text-align:left;}

  .field{margin-bottom:14px;}
  .field input, .field select{
    width:100%; font-family:var(--font-body); font-size:14px; color:var(--cream);
    background:var(--wine); border:1px solid var(--line-strong); border-radius:8px;
    padding:13px 14px;
  }
  .field input::placeholder{color:var(--rose-dim);}
  .field select{color:var(--rose-dim); appearance:none; -webkit-appearance:none;}
  .field select:valid{color:var(--cream);}

  .cta{
    display:inline-block; width:100%; font-family:var(--font-body); font-weight:600; font-size:13px;
    letter-spacing:0.1em; text-transform:uppercase; text-decoration:none;
    color:var(--wine); background:var(--cream); border:none; border-radius:999px;
    padding:15px; cursor:pointer;
    transition:background 0.15s, color 0.15s;
  }
  .cta:hover{background:var(--wine); color:var(--cream);}

  .confirm{display:none; text-align:center; padding:20px 0;}
  .confirm h2{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:24px; margin:0 0 10px;}
  .confirm p{font-size:13.5px; color:var(--rose-dim);}
</style>
</head>
<body>

<nav>
  <span class="word">RARE Club</span>
  <a class="back" href="/">← Retour</a>
</nav>

<main>

  <p class="eyebrow">Bordeaux · bientôt</p>
  <h1>Rejoins la liste d'attente</h1>
  <p class="lead">Sois prévenu·e dès que la première soirée est confirmée — lieu, date, et premier invité.</p>

  <div class="card">
    <form id="signupForm">
      <div class="field"><input type="text" id="prenom" placeholder="Prénom" required></div>
      <div class="field"><input type="text" id="nom" placeholder="Nom" required></div>
      <div class="field"><input type="email" id="email" placeholder="Adresse email" required></div>
      <div class="field"><input type="tel" id="tel" placeholder="Numéro de téléphone (optionnel)"></div>
      <div class="field">
        <select id="source">
          <option value="" disabled selected hidden>Comment nous as-tu connu ?</option>
          <option value="Instagram">Instagram</option>
          <option value="TikTok">TikTok</option>
          <option value="Bouche à oreille">Bouche à oreille</option>
          <option value="Un ami m'a invité·e">Un ami m'a invité·e</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <button type="submit" class="cta">Je m'inscris</button>
    </form>

    <div class="confirm" id="confirmBlock">
      <h2>C'est noté.</h2>
      <p>Tu seras prévenu·e dès que la première soirée est confirmée.</p>
    </div>
  </div>

</main>

<script>
  document.getElementById('signupForm').addEventListener('submit', function(e){
    e.preventDefault();
    var prenom = document.getElementById('prenom').value;
    var nom = document.getElementById('nom').value;
    var email = document.getElementById('email').value;
    var tel = document.getElementById('tel').value;
    var source = document.getElementById('source').value;
    var body = [
      "Prénom : " + prenom,
      "Nom : " + nom,
      "Email : " + email,
      "Téléphone : " + (tel || "—"),
      "Connu via : " + (source || "—")
    ].join("\n");
    var mailto = "mailto:contact.rareclub@gmail.com?subject=" +
      encodeURIComponent("RARE Club — Inscription liste d'attente générale") +
      "&body=" + encodeURIComponent(body);
    window.location.href = mailto;

    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('confirmBlock').style.display = 'block';
  });
</script>

</body>
</html>
